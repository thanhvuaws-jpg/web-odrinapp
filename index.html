<!DOCTYPE html>
<!-- Class "dark" giữ lại có chủ ý: xem chú thích trong js/son-son-mau.js -->
<html lang="vi" class="dark son-son">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | Royal Restaurant</title>

    <!-- Google Fonts: Baloo 2 cho tiêu đề, Be Vietnam Pro cho chữ — cùng bộ với app -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/son-son-mau.js?v=1"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: SON_SON_FONT,
                    colors: SON_SON_MAU,
                    animation: {
                        'fade-in-up': 'fadeInUp 0.7s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(16px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="css/son-son.css?v=1">

    <style>
        /* Nửa trái: tấm hoành sơn son thếp vàng, sóng vàng chạy dọc mép dưới */
        .dn-trai {
            background: linear-gradient(90deg, rgba(31, 18, 13, .82) 0%, rgba(31, 18, 13, .55) 38%, rgba(31, 18, 13, .05) 70%),
                        url(img/son-son/hoanh.jpg) 85% center / cover, var(--son-dam);
        }
        .dn-trai::after {
            content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 36px;
            background: url(img/son-son/song_vang.webp) left bottom / auto 36px repeat-x;
            pointer-events: none;
        }
        /* Nửa phải: giấy dó kem, sen chìm mờ ở góc */
        .dn-phai {
            background: radial-gradient(circle at 70% 20%, #FFF6E2, var(--kem) 60%);
        }
        .dn-phai::before {
            content: ""; position: absolute; right: -80px; bottom: -40px; width: 420px; height: 300px;
            background: url(img/son-son/sen_chim.webp) center / contain no-repeat;
            opacity: .07; pointer-events: none;
        }
        /* Chuyển động vào trang — tắt khi người dùng chọn giảm chuyển động */
        .vao { opacity: 0; animation: fadeInUp .7s ease-out forwards; }
        .tre-1 { animation-delay: 80ms; } .tre-2 { animation-delay: 160ms; } .tre-3 { animation-delay: 240ms; }
        @keyframes fadeInUp {
            0%   { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) { .vao { opacity: 1; animation: none; } }
    </style>
</head>
<body class="font-sans antialiased text-white min-h-screen">

    <div class="min-h-screen grid lg:grid-cols-[1.1fr_1fr]">

        <!-- Tấm hoành -->
        <section class="dn-trai relative overflow-hidden flex flex-col justify-center px-8 py-14 sm:px-14 min-h-[280px] lg:min-h-screen">
            <img src="img/son-son/logo.webp" alt="Logo Royal" class="w-20 h-20 sm:w-24 sm:h-24 vao">
            <h1 class="mt-4 text-4xl sm:text-5xl font-extrabold text-vang-sang leading-tight vao tre-1">Royal Restaurant</h1>
            <p class="mt-2 text-base sm:text-lg max-w-[30ch] text-kem vao tre-2">Đẳng cấp hương vị hoàng gia. Trang dành cho quản lý và thu ngân.</p>
        </section>

        <!-- Thẻ đăng nhập -->
        <section class="dn-phai relative overflow-hidden grid place-items-center px-4 py-10 sm:px-10">
            <div class="glass-panel relative w-full max-w-[420px] rounded-2xl px-6 py-8 sm:px-9 sm:pt-9 sm:pb-7 vao tre-1">
                <h2 class="text-[34px] font-extrabold text-son-dam leading-none">Đăng nhập</h2>
                <p class="mt-2 mb-6 text-chu-mo">Chào mừng bạn quay trở lại!</p>

                <form id="loginForm" class="space-y-4" novalidate>
                    <div class="space-y-1.5">
                        <label for="username" class="block text-xs font-semibold tracking-wide">Tên đăng nhập</label>
                        <div class="relative">
                            <i class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-chu-mo text-sm pointer-events-none"></i>
                            <input type="text" id="username" required autocomplete="username"
                                   class="w-full h-[46px] pl-10 pr-4 text-sm"
                                   placeholder="Nhập tên đăng nhập">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label for="password" class="block text-xs font-semibold tracking-wide">Mật khẩu</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-chu-mo text-sm pointer-events-none"></i>
                            <input type="password" id="password" required autocomplete="current-password"
                                   class="w-full h-[46px] pl-10 pr-12 text-sm"
                                   placeholder="Nhập mật khẩu">
                            <button type="button" id="togglePassword" aria-label="Hiện mật khẩu"
                                    class="absolute inset-y-0 right-0 px-4 flex items-center text-chu-mo hover:text-son transition-colors">
                                <i class="fa-regular fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between gap-3 text-[13px]">
                        <label class="inline-flex items-center gap-2 cursor-pointer select-none text-muc">
                            <input type="checkbox" id="nhoTenDangNhap" class="w-4 h-4 rounded">
                            Ghi nhớ tên đăng nhập
                        </label>
                        <a href="#" id="quenMatKhau" class="font-bold text-son hover:text-son-sang">Quên mật khẩu?</a>
                    </div>

                    <button type="submit" class="ss-nut w-full rounded-xl py-3 text-[15px] font-bold flex items-center justify-center gap-2">
                        <span>Đăng nhập</span>
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    </button>
                </form>

                <p class="mt-6 text-center text-xs text-chu-mo">
                    Đặt bàn cho khách? <a href="/" class="font-bold text-son hover:text-son-sang">Về trang giới thiệu ›</a>
                </p>
            </div>
            <p class="relative mt-6 text-[11px] uppercase tracking-[.16em] text-chu-mo">&copy; 2026 Royal Restaurant</p>
        </section>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/config.js?v=1.2"></script>
    <script src="js/login.js?v=2"></script>
</body>
</html>
